<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Stars Admin</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header><a class="logo" href="index.html">✦ Little<span>Stars</span> ADMIN</a><a href="index.html">View store</a></header><main><h1>Admin dashboard</h1><section id="loginbox" class="narrow"><form id="adminlogin"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn">Sign in</button><p id="loginmsg"></p></form></section><section id="dashboard" hidden><h2>Add / edit product</h2><form id="productform"><input type="hidden" name="id"><label>Name<input name="name" required></label><label>Category<select name="category"><option>Boys</option><option>Girls</option><option>Baby</option><option>Accessories</option></select></label><label>Price<input name="price" type="number" required></label><label>Stock<input name="stock" type="number" value="0"></label><label>Image URL<input name="image_url" type="url"></label><label>Description<textarea name="description"></textarea></label><button class="btn">Save product</button></form><h2>Products</h2><div id="adminproducts"></div><button id="logout" class="btn">Logout</button></section></main><script type="module" src="assets/js/admin.js"></script></body></html>
